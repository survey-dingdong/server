[tool.poetry]
name = "dingdong-survey"
version = "0.0.1"
description = "Survey DingDong"
authors = ["JongPil Yoon <whdvlf94@gmail.com>"]

[tool.poetry.dependencies]
python = "3.11.9"
alembic = "^1.13.1"
uvicorn = "^0.25.0"
fastapi = "^0.109.0"
gunicorn = "^21.2.0"
pythondi = "^1.2.4"
ujson = "^5.9.0"
aiomysql = "^0.2.0"
click = "^8.1.7"
redis = "^5.0.1"
pydantic-settings = "^2.1.0"
pyjwt = "^2.8.0"
pytest-asyncio = "^0.23.3"
cryptography = "^41.0.7"
coverage = "^7.4.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.25"}
pymysql = "^1.1.0"
dependency-injector = "^4.41.0"
httpx = "^0.26.0"
python-multipart = "^0.0.9"
pydantic = {extras = ["email"], version = "^2.7.0"}
pytest-env = "^1.1.3"
fastapi-mail = "^1.4.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
types-redis = "^4.6.0.20240106"
pytest-asyncio = "^0.23.3"
mypy = "1.14.1"
isort = "5.11.3"
ruff = "0.4.10"

[tool.coverage.run]
omit=["tests/*", "test_*.py", "migrations/*"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest_env]
ENV = "test"

[tool.mypy]
python_version = "3.11"

check_untyped_defs = true

disallow_untyped_defs = true

warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

disable_error_code = "attr-defined,union-attr,override"

[[tool.mypy.overrides]]
module = "ujson"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.ruff]
line-length = 88
indent-width = 4

target-version = "py311"

[tool.ruff.lint]
# ref: https://beta.ruff.rs/docs/rules/
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "T20",    # print
    "S",      # bandit
    "PL",     # pylint
    "SIM",    # flake8-simplify
    "C90",    # mccabe (keep is simple)
    "ASYNC",  # flake8-async
    "ERA001", # commented-out-code
    "TID252", # absolute imports
]
ignore = [
    "E501", # line too long
    "N818",
    "PLR0913",
    "PLR2004", # Magic value used in comparison
    "S101", # use of assert
    "S104", # Possible binding to all interfaces
    "S105", # Possible hardcoded password assigned to
    "S106", # Possible hardcoded password assigned to argument
    "S107", # Possible hardcoded password assigned to function default
    "S311", # Standard pseudo-random generators are not suitable for cryptographic purposes
    "S701", # jinja2 template injection
    "SIM117",
    "PLR0911", # Too many return statements
]

# Allow autofix for all enabled rules is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10